<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover"><meta name="theme-color" content="#145c3e">
  <title>Offline · SonicPages</title>
  <style>
    :root{color-scheme:light dark;font-family:Inter,system-ui,sans-serif;background:#f7f8f5;color:#17211b}*{box-sizing:border-box}body{margin:0}header{position:sticky;top:0;display:flex;align-items:center;gap:12px;padding:14px 20px;border-bottom:1px solid #dfe5df;background:#f7f8f5ee;backdrop-filter:blur(16px)}header img{width:32px;height:32px}.title{min-width:0;flex:1}.title strong,.title span{display:block;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}.title span{font-size:12px;color:#68736c}button,select{border:1px solid #dfe5df;border-radius:10px;background:#fff;color:inherit;padding:9px 12px}main{max-width:760px;margin:auto;padding:48px 22px 100px;font-family:Georgia,serif;font-size:19px;line-height:1.8}h1{font:650 38px/1.15 Inter,system-ui,sans-serif;margin:0 0 12px}.author{color:#68736c;margin-bottom:42px}.copy p{margin:0 0 1.35em}.empty{font-family:Inter,system-ui,sans-serif;text-align:center;padding-top:18vh}.empty img{width:64px}.empty p{color:#68736c;max-width:420px;margin:14px auto}.badge{font-size:11px;font-weight:700;color:#145c3e;text-transform:uppercase;letter-spacing:.12em}@media(prefers-color-scheme:dark){:root{background:#0c120f;color:#edf5ef}header{background:#0c120fee;border-color:#26342b}button,select{background:#131b16;border-color:#26342b}.title span,.author,.empty p{color:#9ca9a0}.badge{color:#60d394}}
  </style>
</head>
<body><header><img src="/logo.svg" alt=""><div class="title"><strong id="document-title">SonicPages</strong><span id="status">Offline reader</span></div><select id="sections" hidden aria-label="Section"></select></header><main id="content"><div class="empty"><img src="/logo.svg" alt=""><h1>You’re offline</h1><p>This page is not saved on this device. Reconnect, open a document, and use the download button to make it available offline.</p></div></main>
<script>
const pathMatch=location.pathname.match(/^\/reader\/([^/?#]+)/);const id=pathMatch?decodeURIComponent(pathMatch[1]):new URLSearchParams(location.search).get("documentId");
if(id){const request=indexedDB.open("sonicpages-offline",1);request.onupgradeneeded=()=>{const db=request.result;if(!db.objectStoreNames.contains("documents"))db.createObjectStore("documents",{keyPath:"id"});if(!db.objectStoreNames.contains("mutations"))db.createObjectStore("mutations",{keyPath:"id",autoIncrement:true})};request.onsuccess=()=>{const db=request.result;const get=db.transaction("documents").objectStore("documents").get(id);get.onsuccess=()=>get.result?render(get.result):null}}
function render(doc){document.title=doc.title+" · SonicPages";document.getElementById("document-title").textContent=doc.title;document.getElementById("status").textContent="Saved "+new Date(doc.savedAt).toLocaleString();const select=document.getElementById("sections");select.hidden=false;doc.sections.forEach((section,index)=>{const option=document.createElement("option");option.value=index;option.textContent=section.title||"Section "+(index+1);select.append(option)});select.onchange=()=>renderSection(doc,Number(select.value));renderSection(doc,0)}
function renderSection(doc,index){const section=doc.sections[index];const main=document.getElementById("content");main.replaceChildren();const badge=document.createElement("div");badge.className="badge";badge.textContent="Available offline · "+(doc.format||"document");const heading=document.createElement("h1");heading.textContent=section.title||doc.title;main.append(badge,heading);if(doc.author){const author=document.createElement("div");author.className="author";author.textContent=doc.author;main.append(author)}const copy=document.createElement("div");copy.className="copy";section.text.split(/\n{2,}/).filter(Boolean).forEach(text=>{const p=document.createElement("p");p.textContent=text;copy.append(p)});main.append(copy)}
</script></body></html>
