name: Mobile checks

on:
  pull_request:
    paths:
      - 'mobile/**'
      - '.github/workflows/mobile.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  android:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: mobile
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: mobile/package-lock.json
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 17
      - uses: gradle/actions/setup-gradle@v4
      - run: npm ci
      - run: npm run typecheck
      - run: npm test
      - run: npx expo export --platform android --output-dir "$RUNNER_TEMP/sonicpages-export"
      - name: Build Android development APK
        working-directory: mobile/android
        run: bash gradlew :app:assembleDebug -PreactNativeArchitectures=arm64-v8a
      - uses: actions/upload-artifact@v4
        with:
          name: sonicpages-android-debug
          path: mobile/android/app/build/outputs/apk/debug/app-debug.apk
