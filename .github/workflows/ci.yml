name: CI

on:
  pull_request:
  push:
    branches:
      - master

permissions:
  contents: read

jobs:
  validate:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: postgres
          POSTGRES_DB: sonicpages
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U postgres -d sonicpages"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
    env:
      DATABASE_URL: postgresql://postgres:postgres@localhost:5432/sonicpages
      AUTH_SECRET: ci-only-secret-with-at-least-32-characters
    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v7
        with:
          node-version: 20
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Run tests
        run: npm test

      - name: Validate database schema
        run: npm run db:validate

      - name: Apply database migrations
        run: npm run db:migrate

      - name: Check migration drift
        run: npx prisma migrate diff --from-url "$DATABASE_URL" --to-schema-datamodel prisma/schema.prisma --exit-code

      - name: Smoke-test ingestion worker
        run: INGESTION_RUN_ONCE=true npm run worker:ingestion

      - name: Smoke-test audio worker
        run: AUDIO_RUN_ONCE=true npm run worker:audio

      - name: Lint
        run: npm run lint

      - name: Type-check
        run: npm run typecheck

      - name: Build
        run: npm run build

      - name: Audit production dependencies
        run: npm run audit:production

      - name: Reject provider tokens in tracked files
        shell: bash
        run: |
          if git grep -nE '(ntn_[A-Za-z0-9]{20,}|AKIA[0-9A-Z]{16}|gh[pousr]_[A-Za-z0-9]{20,})'; then
            echo 'Potential provider credential found in a tracked file.'
            exit 1
          fi
